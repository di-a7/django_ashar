{% extends "base.html" %}
{% block title %}{{title}}{% endblock title %}


{% block body %}
{{heading}}
   <div class="container">
      <table class="table">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">Name</th>
              <th scope="col">Age</th>
              <th scope="col">Contact</th>
            </tr>
          </thead>
          <tbody>
            {% for person in people %}
            <tr>
              <th scope="row">1</th>
              <td>{{person.name}}</td>
              <td>{{person.age}}</td>
              <td>{{person.contact}}</td>
            </tr>
            {% endfor %}
          </tbody>
    </table>
   </div>
{% endblock body %}
